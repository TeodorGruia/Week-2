<!doctype html>
<html lang="en">
  <head>
    <title>Bootstrap Example</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="/js/main.js" defer></script>
  </head>
  <body>
    <!-- Tables -->
    <div class="container bg-primary-subtle py-4">
      <!-- First table and picure -->
      <div class="row mb-4">
        <div class="col-sm-4">
          <img
            src="/record player.png"
            class="rounded float-start img-fluid"
            alt="Responsive image"
          />
        </div>
        <div class="col-sm-8">
          <h2>Good Music!</h2>
          <table class="table table-striped table-hover table-success">
            <thead>
              <tr class="table-primary">
                <th>Artist Name</th>
                <th>Song</th>
                <th>Year</th>
              </tr>
            </thead>
            <tbody id="singerTable"></tbody>
          </table>
        </div>
      </div>

      <!-- Second table and picture -->
      <div class="row">
        <div class="col-sm-4">
          <img
            src="/sound-factory-72.png"
            class="rounded float-start img-fluid"
            alt="Responsive image"
          />
        </div>
        <div class="col-sm-8">
          <h2>Many of these songs were remixed for danceability</h2>
          <table class="table table-striped">
            <thead>
              <tr class="table-warning">
                <th>Remix</th>
                <th>Remixer</th>
                <th>Year</th>
              </tr>
            </thead>
            <tbody id="remixTable"></tbody>
          </table>
        </div>
      </div>
    </div>
  </body>
</html>
